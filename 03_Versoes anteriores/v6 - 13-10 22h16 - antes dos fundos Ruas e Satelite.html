        e.target.tagName, String(e.target.src || e.target.href || ''));

    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed

    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      return out;

    window.addEventListener('message', function (e) {

      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {

        if (ownFrameWindows().indexOf(e.source) < 0) return;

          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

              const { done, value } = await reader.read();

        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"3e768a94-6b11-4fb4-ac7a-c1654b600c2e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"577f31d7-5274-4a81-ba91-5663233c3dc4\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"f1079871-ac99-472e-bcae-f571f5b1bed1\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"67431bd7-f023-45af-92e8-35d80537f01f\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"070eeb3f-b1ab-4adf-9245-dbadb51082f1\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"686463ce-9e34-4c66-87eb-b214f0c4c4fe\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"3e768a94-6b11-4fb4-ac7a-c1654b600c2e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #0088b0;\n  --color-accent-2: #d6006c;\n  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #e9f8ff;\n  --color-accent-200: #cbeeff;\n  --color-accent-300: #99e0ff;\n  --color-accent-400: #62c5ee;\n  --color-accent-500: #38a6cf;\n  --color-accent-600: #1186ac;\n  --color-accent-700: #006786;\n  --color-accent-800: #004961;\n  --color-accent-900: #0a303e;\n\n  --color-accent-2-100: #fff1f4;\n  --color-accent-2-200: #ffdee6;\n  --color-accent-2-300: #ffc0d0;\n  --color-accent-2-400: #ff90b1;\n  --color-accent-2-500: #ff458e;\n  --color-accent-2-600: #d82071;\n  --color-accent-2-700: #aa0b56;\n  --color-accent-2-800: #790e3d;\n  --color-accent-2-900: #4b1528;\n\n  /* The third process ink — review round 3: the deck's print treatments\n     (the CMYK separation and the misregistered plate numerals below) need\n     the full four-color set. Cyan and magenta are the system's own accents;\n     this yellow completes them, muted to the same press-ink register. A\n     print treatment color, not an interface accent — body copy and chrome\n     never take it. */\n  --color-process-yellow: #edbb00;\n\n  --font-heading: \"Source Serif 4\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Source Serif 4\", system-ui, sans-serif;\n\n  --space-1: 5.0px;\n  --space-2: 10.0px;\n  --space-3: 15.0px;\n  --space-4: 20.0px;\n  --space-6: 30.0px;\n  --space-8: 40.0px;\n\n  --radius-sm: 1px;\n  --radius-md: 2px;\n  --radius-lg: 4px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.halftone{position:relative;filter:grayscale(0.35) contrast(1.15);overflow:hidden}\n.halftone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The four-color separation treatment (review round 3) — a photograph\n   printed as its misregistered process plates, after the Catalogue Three\n   grammar. Markup: a figure.cmyk holding five copies of the image — the\n   first is the layout sizer (hidden), then one per plate, each tagged\n   .sep-c/.sep-m/.sep-y/.sep-k. The plates are extracted live by the SVG\n   feColorMatrix filters in print-plates.js, the system's own defs —\n   inlined in the compiled bundle every template page loads, and a\n   page that links styles.css directly adds\n   <script src=\"print-plates.js\"><\u002Fscript> itself (the defs must be in\n   the document: a data-URI filter reference would not survive Chromium,\n   and external-file references are unreliable across engines) — nudged\n   a few pixels out of register, and multiplied\n   onto the paper ground; the halftone dot screens the recombined print.\n   The plate offsets live with the deck's projection-scale CSS, since\n   misregistration is sized to the output. */\n.cmyk{position:relative;overflow:hidden;background:var(--color-bg)}\n.cmyk img:first-child{opacity:0} /* layout sizer AND the alt-bearing image — opacity\n  keeps it in the accessibility tree (visibility:hidden would drop the figure's only\n  description); fully transparent, it adds nothing to the multiply backdrop */\n.cmyk img+img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}\n.cmyk .sep-c{filter:url(#sep-c)}\n.cmyk .sep-m{filter:url(#sep-m)}\n.cmyk .sep-y{filter:url(#sep-y)}\n.cmyk .sep-k{filter:url(#sep-k)}\n.cmyk::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The one-image separation (review round 9, promoted from the deck in the\n   landing divergence) — the same four plates as ONE compound filter,\n   #sep-all in print-plates.js, for a single swappable image: a .print\n   wrapper inside the figure holds one <image-slot>, and the filter\n   extracts, offsets and multiplies the plates live from whatever the slot\n   shows. Markup: figure.cmyk > .print > image-slot (the page sizes the\n   .print — aspect-ratio, or absolute fill for bleeds). Hover resolves\n   the print into the photograph — the pressman checking registration on\n   the light table — so the source shows crisp and any swap chrome stays\n   legible; only the reduced-motion fallback below still lifts as a\n   single cut (a url() filter cannot CSS-transition; the press driver\n   animates the defs instead). */\n.cmyk .print{position:relative;width:100%;filter:url(#sep-all)}\n/* no hover end-state swap: the press driver (print-plates.js) eases the\n   plates into register while purifying their inks to the pure-process\n   separation on the same curve, so the converged four-plate merge IS\n   the photograph (their multiply equals SourceGraphic by construction)\n   — no cut anywhere on the animated path */\n@media (prefers-reduced-motion: reduce), (hover: none), (pointer: coarse) {\n  .cmyk .print:hover{filter:none} /* without the driver (it stands down on\n    exactly these conditions), hover stays the old single cut to the\n    crisp source */\n}\n.cmyk .print image-slot{width:100%;height:100%;display:block}\n\n/* The plate numeral (review rounds 3-4) — display figures set as\n   misregistered process plates, the catalog's cover grammar. Review\n   round 4 (Barron): THREE plates — C, M, Y only, no black plate — so the\n   dark core comes entirely from the C×M×Y multiply overlap (the inks\n   product to exact black), with the fringes the registration drift; and\n   the spread pulled in by half (less jumbled: one figure with plate\n   fringes rather than figures sliding apart). Markup: a .cmyk-num holding\n   a .paper span (the white of the sheet: the glyph's union, built from\n   offset text-shadow copies) and three .plate spans. The construction\n   carries its own ground (--cmyk-num-ground, defaulting to paper) painted\n   on its padding box, so the multiply plates always have their backdrop\n   even inside an isolated stacking context (entrance animations); the\n   padding bleeds wider than any plate offset and the negative margin\n   hands the layout box back. Offsets are em-scaled to the glyph. The\n   .paper span carries the text once for assistive tech; the .plate spans\n   are aria-hidden repeats. */\n.cmyk-num{--cmyk-num-ground:var(--color-bg);\n  position:relative;width:fit-content;line-height:0.9;\n  font-feature-settings:\"pnum\" 1;\n  background:var(--cmyk-num-ground);padding:0.12em;margin:-0.12em}\n.cmyk-num .paper{color:var(--color-bg); /* the white of the sheet — always paper,\n  whatever the ground: the plates read as printed on paper even when the\n  surrounding page is ink */\n  text-shadow:0.036em 0.025em 0 var(--color-bg),-0.031em -0.023em 0 var(--color-bg)}\n.cmyk-num .plate{position:absolute;inset:0.12em;mix-blend-mode:multiply;\n  text-box:trim-both cap alphabetic /* the host trims to its cap box; each\n  absolute plate must trim its own line the same way, or its glyphs sit a\n  half-leading below the paper union */}\n.cmyk-num .plate-c{color:var(--color-accent)}\n\n/* The plate headline (divergence round 3, Barron: \"use both\" — the\n   photograph's plates AND the cover grammar's text plates, on the same\n   page). The same three-plate construction as .cmyk-num — paper span\n   carrying the real text, C/M/Y plate repeats, dark core from the\n   multiply overlap — at HALF the numeral's round-4 offsets: the serif's\n   display hairlines are thinner than the numeral strokes the spread was\n   measured on, and the full offsets swallow them whole (probed at the\n   hero's 80px — the fringes read as an anaglyph poster, not a breath\n   out of register) — recut for display\n   headlines that sit in running text blocks on the page's own paper:\n   no ground painting and no padding bleed (the numeral's ground exists\n   for isolated stacking contexts; a headline on the page multiplies\n   straight onto the sheet), no width:fit-content and no line-height\n   override (the host display class owns its metrics — apply this to\n   each .line, which is position:relative for its plates), and the\n   plates are inert to the hand (pointer-events/user-select none, so a\n   triple-click selects the headline once, not four times). Plates take\n   the same pointer lean as .cmyk-num. */\n.cmyk-head{position:relative}\n.cmyk-head .paper{color:var(--color-bg);\n  text-shadow:0.027em 0.0185em 0 var(--color-bg),-0.0245em -0.0175em 0 var(--color-bg)\n  /* the union's copies sit at the construction's halved plate offsets\n     PLUS the full lean (0.018+0.009 / 0.0125+0.006, and mirrored), so\n     the union still backs the plates at viewport-edge lean — invisible\n     on the page's own paper, load-bearing on any other ground */}\n.cmyk-head .plate{position:absolute;inset:0;mix-blend-mode:multiply;\n  pointer-events:none;user-select:none;\n  text-box:trim-both cap alphabetic /* match the host's trim, or the\n  plates sit a half-leading below the paper union */}\n.cmyk-head .plate-c{color:var(--color-accent)}\n.cmyk-head .plate-m{color:var(--color-accent-2);\n  translate:calc(0.018em + 0.009em*var(--press-nx, 0)) calc(0.0125em + 0.006em*var(--press-ny, 0))}\n.cmyk-head .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.0155em + 0.009em*var(--press-nx, 0)) calc(-0.0115em + 0.006em*var(--press-ny, 0))}\n.cmyk-num .plate-m{color:var(--color-accent-2);\n  translate:calc(0.036em + 0.018em*var(--press-nx, 0)) calc(0.025em + 0.0125em*var(--press-ny, 0))}\n.cmyk-num .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.031em + 0.018em*var(--press-nx, 0)) calc(-0.023em + 0.0125em*var(--press-ny, 0))}\n/* --press-nx/--press-ny: the pointer lean as a bare -1..1 factor,\n   published on :root by the press driver (print-plates.js) and zero\n   whenever the driver stands down. Each construction scales the lean to\n   its own spread (half of it, here as everywhere) so the moving plates\n   drift a breath toward the cursor and the C plate holds. */\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input::placeholder { color: color-mix(in srgb, var(--color-text) 65%, transparent); opacity: 1; }\n  /* explicit, measured: the browser default gray misses the 4.5:1 small-text bar on\n     the surface fill; 65% ink measures 4.8:1 there, still a step quieter than typed\n     text (opacity:1 overrides Firefox's default placeholder fade) */\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"e3e68153-c8fb-4f2d-a09e-03b27989e576\"><\u002Fscript>\n<script src=\"68a45299-35ec-4170-9f12-28052a2964ff\"><\u002Fscript>\n<style>\nbody{margin:0;background:#f3f2f2;-webkit-font-smoothing:antialiased}\na{color:var(--color-accent-700)}a:hover{color:var(--color-accent-800)}\ninput[type=range]{accent-color:#0088b0}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"max-width:1560px;margin:0 auto;padding:var(--space-6) 32px 64px;font-family:var(--font-body);color:var(--color-text);box-sizing:border-box\">\n\n  <header style=\"display:flex;flex-direction:column;gap:6px\">\n    <div style=\"height:4px;background:var(--color-text)\"><\u002Fdiv>\n    <div style=\"height:1px;background:var(--color-text)\"><\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:10px 0 8px;flex-wrap:wrap\">\n      <span style=\"font-size:13px;letter-spacing:.12em;text-transform:uppercase\">ULS Amadora/Sintra · Serviço de Urgência<\u002Fspan>\n      <span style=\"font-size:13px;font-style:italic\">Origem e prioridade das admissões · 1.º trimestre de 2026<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"height:1px;background:var(--color-text)\"><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;padding:7px 0;font-size:12px;flex-wrap:wrap\">\n      <span>31 dez 2025 – 31 mar 2026<\u002Fspan><span>{{ totalLabel }} admissões<\u002Fspan><span>5 locais de entrada<\u002Fspan><span>Triagem de Manchester<\u002Fspan><span style=\"margin-left:auto;font-style:italic\">Fonte: BD_Urgencia_Admissoes.csv<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"height:1px;background:var(--color-text)\"><\u002Fdiv>\n  <\u002Fheader>\n\n  <section style=\"display:flex;flex-wrap:wrap;gap:30px 56px;padding:40px 0 32px;align-items:flex-end\">\n    <div style=\"flex:1 1 560px;min-width:0\">\n      <h1 style=\"font-size:clamp(38px,4vw,52px);line-height:1.05;letter-spacing:-.015em;margin:0 0 16px;max-width:16em;text-wrap:balance\">De onde vêm os doentes da urgência, e com que prioridade chegam<\u002Fh1>\n      <p style=\"font-size:18px;line-height:1.5;margin:0;max-width:46em;text-wrap:pretty\">{{ lede }}<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 360px;max-width:560px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:22px 26px\">\n      <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n        <div style=\"display:flex;flex-direction:column;gap:2px\">\n          <span style=\"font-size:12px;color:var(--color-neutral-700)\">{{ k.label }}<\u002Fspan>\n          <span style=\"font-size:34px;line-height:1.05;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em\">{{ k.value }}<\u002Fspan>\n          <span style=\"font-size:12px;font-style:italic;color:var(--color-neutral-700)\">{{ k.sub }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display:flex;flex-wrap:wrap;gap:40px 32px;align-items:flex-start\">\n\n    <aside style=\"flex:0 0 310px;min-width:0;display:flex;flex-direction:column;gap:34px\">\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700)\">Opções do mapa<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font-size:13px;color:var(--color-neutral-700)\">Tratamento<\u002Fspan>\n          <div class=\"seg\" style=\"align-self:flex-start\"><sc-for list=\"{{ modes }}\" as=\"o\" hint-placeholder-count=\"4\"><label class=\"seg-opt\"><input type=\"radio\" name=\"modo\" checked=\"{{ o.on }}\" sc-camel-on-change=\"{{ o.pick }}\">{{ o.label }}<\u002Flabel><\u002Fsc-for><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:20px;flex-wrap:wrap\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:13px;color:var(--color-neutral-700)\">Medir<\u002Fspan>\n            <div class=\"seg\"><sc-for list=\"{{ metrics }}\" as=\"o\" hint-placeholder-count=\"2\"><label class=\"seg-opt\"><input type=\"radio\" name=\"metrica\" checked=\"{{ o.on }}\" sc-camel-on-change=\"{{ o.pick }}\">{{ o.label }}<\u002Flabel><\u002Fsc-for><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:13px;color:var(--color-neutral-700)\">Fundo<\u002Fspan>\n            <div class=\"seg\"><sc-for list=\"{{ fundos }}\" as=\"o\" hint-placeholder-count=\"2\"><label class=\"seg-opt\"><input type=\"radio\" name=\"fundo\" checked=\"{{ o.on }}\" sc-camel-on-change=\"{{ o.pick }}\">{{ o.label }}<\u002Flabel><\u002Fsc-for><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:20px;flex-wrap:wrap\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:13px;color:var(--color-neutral-700)\">Vista<\u002Fspan>\n            <div class=\"seg\"><sc-for list=\"{{ zooms }}\" as=\"o\" hint-placeholder-count=\"2\"><label class=\"seg-opt\"><input type=\"radio\" name=\"zoom\" checked=\"{{ o.on }}\" sc-camel-on-change=\"{{ o.pick }}\">{{ o.label }}<\u002Flabel><\u002Fsc-for><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:13px;color:var(--color-neutral-700)\">Escala de cor<\u002Fspan>\n            <div class=\"seg\"><sc-for list=\"{{ scales }}\" as=\"o\" hint-placeholder-count=\"2\"><label class=\"seg-opt\"><input type=\"radio\" name=\"escala\" checked=\"{{ o.on }}\" sc-camel-on-change=\"{{ o.pick }}\">{{ o.label }}<\u002Flabel><\u002Fsc-for><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font-size:13px;color:var(--color-neutral-700)\">Origem <span style=\"font-style:italic\">· pode escolher várias<\u002Fspan><\u002Fspan>\n          <div class=\"seg\" style=\"align-self:flex-start\"><sc-for list=\"{{ origens }}\" as=\"o\" hint-placeholder-count=\"4\"><label class=\"seg-opt\"><input type=\"checkbox\" checked=\"{{ o.on }}\" sc-camel-on-change=\"{{ o.pick }}\">{{ o.label }}<\u002Flabel><\u002Fsc-for><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <span style=\"font-size:13px;color:var(--color-neutral-700)\">Local de entrada<\u002Fspan>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px 16px\">\n            <sc-for list=\"{{ locais }}\" as=\"o\" hint-placeholder-count=\"6\"><label class=\"radio\"><input type=\"radio\" name=\"local\" checked=\"{{ o.on }}\" sc-camel-on-change=\"{{ o.pick }}\"><span class=\"dot\"><\u002Fspan>{{ o.label }}<\u002Flabel><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <div>\n          <div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:4px\">Triagem de Manchester<\u002Fdiv>\n          <h2 style=\"font-size:26px;line-height:1.15;margin:0\">{{ panelTitle }}<\u002Fh2>\n          <div style=\"display:flex;gap:10px;align-items:baseline;margin-top:4px;font-size:13px;flex-wrap:wrap\">\n            <span style=\"font-style:italic;color:var(--color-neutral-700)\">{{ panelSub }}<\u002Fspan>\n            <sc-if value=\"{{ hasSel }}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn btn-ghost\" style=\"padding:2px 5px;font-size:13px\" sc-camel-on-click=\"{{ clearSel }}\">Ver toda a área<\u002Fbutton><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:5px\">\n          <div style=\"display:flex;height:22px;border-radius:var(--radius-md);overflow:hid Fsection>\n\n  <sc-if value=\"{{ hasFq }}\" hint-placeholder-val=\"{{ false }}\">\n  <section style=\"padding-top:64px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:8px;flex-wrap:wrap\">\n      <div>\n        <div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:4px\">Utentes · período completo<\u002Fdiv>\n        <h2 style=\"font-size:28px;line-height:1.15;margin:0\">Quem volta muitas vezes<\u002Fh2>\n      <\u002Fdiv>\n      <span style=\"font-size:13px;font-style:italic;color:var(--color-neutral-700)\">Não segue a janela nem os filtros · clique numa linha para a ver no mapa<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin:0 0 18px;font-size:14px;line-height:1.5;max-width:52em;color:var(--color-neutral-800)\">{{ fqLede }}<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,560px),1fr));gap:0 56px\">\n      <sc-for list=\"{{ fqRows }}\" as=\"r\" hint-placeholder-count=\"12\">\n        <button onClick=\"{{ r.click }}\" style=\"display:grid;grid-template-columns:28px minmax(0,1.4fr) 70px minmax(0,1fr) 48px;gap:12px;align-items:center;padding:10px 6px;margin:0 -6px;border:0;background:{{ r.bg }};font:inherit;font-size:14px;color:var(--color-text);text-align:left;cursor:pointer;border-radius:var(--radius-md)\" style-hover=\"background:color-mix(in srgb,#201e1d 6%,transparent)\">\n          <span style=\"font-variant-numeric:tabular-nums;color:var(--color-neutral-600)\">{{ r.i }}<\u002Fspan>\n          <span style=\"display:flex;flex-direction:column;min-width:0\"><span style=\"white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ r.name }}<\u002Fspan><span style=\"font-size:12px;font-style:italic;color:var(--color-neutral-700)\">{{ r.con }}<\u002Fspan><\u002Fspan>\n          <span style=\"text-align:right;font-variant-numeric:tabular-nums\">{{ r.n }}<\u002Fspan>\n          <span style=\"display:flex;height:10px;border-radius:1px;overflow:hidden;background:var(--color-neutral-200)\"><i title=\"{{ r.t }}\" style=\"display:block;width:{{ r.w }}%;background:#0088b0\"><\u002Fi><\u002Fspan>\n          <span style=\"text-align:right;font-variant-numeric:tabular-nums;font-weight:600\">{{ r.pct }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"margin:10px 0 0;font-size:12.5px;font-style:italic;color:var(--color-neutral-700)\">Por linha: utentes frequentes, peso das suas idas nas admissões da freguesia (barra) e percentagem dos utentes da freguesia que são frequentes.<\u002Fp>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <section style=\"padding-top:64px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:8px;flex-wrap:wrap\">\n      <div>\n        <div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:4px\">Hora × dia da semana · {{ rangeLabel }}<\u002Fdiv>\n        <h2 style=\"font-size:28px;line-height:1.15;margin:0\">Quando chegam<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:0 0 18px;font-size:14px;line-height:1.5;max-width:52em;color:var(--color-neutral-800)\">{{ hmNote }}<\u002Fp>\n    <div style=\"overflow-x:auto\">\n      <div style=\"display:grid;grid-template-columns:36px repeat(24,minmax(30px,1fr)) 64px;gap:3px;min-width:900px;font-variant-numeric:tabular-nums\">\n        <sc-for list=\"{{ hmRows }}\" as=\"r\" hint-placeholder-count=\"7\">\n          <span style=\"font-size:13px;font-style:italic;align-self:center\">{{ r.dia }}<\u002Fspan>\n          <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"24\">\n            <span title=\"{{ c.t }}\" style=\"display:flex;align-items:center;justify-content:center;height:28px;font-size:12px;background:{{ c.bg }};color:{{ c.fg }};border-radius:1px\">{{ c.v }}<\u002Fspan>\n          <\u002Fsc-for>\n          <span style=\"font-size:14px;font-weight:600;text-align:right;align-self:center\">{{ r.tot }}<\u002Fspan>\n        <\u002Fsc-for>\n        <span><\u002Fspan>\n        <sc-for list=\"{{ hmHours }}\" as=\"h\" hint-placeholder-count=\"24\"><span style=\"font-size:12px;text-align:center;color:var(--color-neutral-700);padding-top:4px\">{{ h }}<\u002Fspan><\u002Fsc-for>\n        <span style=\"font-size:12px;text-align:right;font-style:italic;color:var(--color-neutral-700);padding-top:4px\">total/dia<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"padding-top:48px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--color-neutral-700);max-width:70em\">\n    <span>{{ foot }}<\u002Fspan>\n    <span>Urgentes = vermelho, laranja e amarelo. Proporções por freguesia só são coloridas com pelo menos 30 admissões no recorte. Limites de freguesia: CAOP. {{ foot2 }} O mapa de fundo (Esri) só descarrega imagens; nenhum dado de doentes sai deste computador.<\u002Fspan>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst PRIO = [['Vermelho','#d6342c','emergente'],['Laranja','#ef8a22','muito urgente'],['Amarelo','#edbb00','urgente'],['Verde','#3a9d4a','pouco urgente'],['Azul','#2f6fc6','não urgente'],['Branco','#ffffff','fora da triagem'],['Não triado','#9b9797','']];\nconst RAMP_C = ['#cbeeff','#99e0ff','#62c5ee','#38a6cf','#1186ac','#006786','#004961'];\nconst RAMP_M = ['#ffdee6','#ffc0d0','#ff90b1','#ff458e','#d82071','#aa0b56','#790e3d'];\nconst MIN_N = 30, KEY = 'urg-origem-v2';\nconst MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];\nconst NF = new Intl.NumberFormat('pt-PT');\nconst pc = (x, d = 0) => isFinite(x) ? (x * 100).toLocaleString('pt-PT', {maximumFractionDigits: d, minimumFractionDigits: d}) + '%' : '—';\nconst nice = s => s.replace(/^União das Freguesias d[aeo]s? /, '').replace(/ \\(S\\. Maria.*\\)$/, '');\nconst sum = a => a.reduce((x, y) => x + y, 0);\nconst tt = (v, t, i) => `${PRIO[i][0]}: ${NF.format(v)} · ${pc(t ? v / t : 0, 1)}`;\nconst z7 = () => [0,0,0,0,0,0,0];\nconst fd = s => { const [y, m, d] = s.split('-'); return `${+d} ${MES[+m - 1]}`; };\nconst fdy = s => { const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };\n\nfunction bboxOf(paths) {\n  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;\n  for (const p of paths) { const re = /(-?\\d+\\.?\\d*),(-?\\d+\\.?\\d*)/g; let m;\n    while ((m = re.exec(p))) { const x = +m[1], y = +m[2]; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; } }\n  return [x0, y0, x1, y1];\n}\nfunction fitAspect(b, asp, padF) {\n  let w = b[2] - b[0], h = b[3] - b[1]; const pad = w * padF; w += 2 * pad; h += 2 * pad;\n  const cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2;\n  if (w / h < asp) w = h * asp; else h = w / asp;\n  return [cx - w / 2, cy - h / 2, w, h];\n}\n\nclass Component extends DCLogic {\n  state = { mode: 'calor', metric: 'n', local: -1, prios: [], sel: null, hover: null, zoom: 'area', fundo: 'mapa', fixed: true,\n            win: 7, end: null, vbC: null, orig: [], playing: false, speed: 450, grids: null, mapW: 900 };\n  mapRef = React.createRef();\n\n  componentDidMount() {\n    const U = window.URG; if (!U) { this.waitURG = setTimeout(() => this.componentDidMount(), 60); return; }\n    this.U = U; const N = U.days.length;\n    this.fregs = U.feats.filter(f => f.t === 1);\n    this.cons = U.feats.filter(f => f.t === 0);\n    this.bb = new Map(this.fregs.map(f => [f.d, bboxOf([f.p])]));\n    this.pop = U.pop || {}; // população residente por freguesia: INE, Censos 2021\n    this.popCon = {}; for (const f of this.fregs) { const P = this.pop[f.d]; if (P) this.popCon[f.c] = (this.popCon[f.c] || 0) + P[0]; }\n    this.vbArea = fitAspect(bboxOf(this.cons.filter(c => c.c === 'Sintra' || c.c === 'Amadora').map(c => c.p)), 1.3, 0.04);\n    this.vbReg = fitAspect([0, 60, U.meta.w, U.meta.h - 60], 1.3, 0);\n    const R = U.R; this.off = new Array(N + 1).fill(R.length);\n    for (let j = R.length - 6; j >= 0; j -= 6) this.off[R[j]] = j;\n    for (let d = N - 1; d >= 0; d--) if (this.off[d] > this.off[d + 1]) this.off[d] = this.off[d + 1];\n    this.cache = new Map();\n    if (!this.ttEl) {\n      const T = this.ttEl = document.createElement('div');\n      T.style.cssText = 'position:fixed;z-index:9999;pointer-events:none;display:none;background:#f3f2f2;color:#201e1d;box-shadow:0 2px 10px rgba(32,30,29,.28);border-radius:2px;padding:8px 10px;font:13px/1.45 Source Serif 4,serif;font-variant-numeric:tabular-nums;white-space:nowrap';\n      document.body.appendChild(T);\n      const grab = c => { if (c.hasAttribute('title')) { c._tt = c.getAttribute('title'); c.removeAttribute('title'); } return c._tt; };\n      this.onTT = e => {\n        const t = e.target, i = t && t.closest ? t.closest('i') : null, bar = i ? i.parentElement : t;\n        const segs = bar && bar.children ? [...bar.children].filter(c => c.tagName === 'I' && grab(c)) : [];\n        if (!segs.length) { T.style.display = 'none'; this.ttKey = null; return; }\n        const key = segs.map(c => c._tt).join('|') + '#' + segs.indexOf(i);\n        if (key !== this.ttKey) { this.ttKey = key; T.textContent = '';\n          segs.forEach(c => { const r = document.createElement('div'), d = document.createElement('span');\n            r.style.cssText = 'display:flex;align-items:center;gap:7px;font-weight:' + (c === i ? 700 : 400) + ';opacity:' + (!segs.includes(i) || c === i ? 1 : .7);\n            d.style.cssText = 'flex:none;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(32,30,29,.3);background:' + c.style.background;\n            r.append(d, c._tt); T.appendChild(r); }); }\n        T.style.display = 'block';\n        T.style.left = Math.max(6, Math.min(e.clientX + 14, innerWidth - T.offsetWidth - 6)) + 'px';\n        T.style.top = Math.max(6, Math.min(e.clientY + 16, innerHeight - T.offsetHeight - 6)) + 'px';\n      };\n      document.addEventListener('mousemove', this.onTT);\n    }\n    let saved = {}; try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}\n    this.setState({ end: N - 2, ...saved, orig: Array.isArray(saved.orig) ? saved.orig : [], playing: false });\n    this.ro = new ResizeObserver(() => { const w = this.mapRef.current && this.mapRef.current.clientWidth; if (w && Math.abs(w - this.state.mapW) > 40) this.setState({ mapW: w }); });\n    setTimeout(() => this.setState({ grids: { area: this.grid(3.4, this.vbReg), regiao: this.grid(6.5, this.vbReg) } }), 0);\n    this.onWheel = e => { e.preventDefault(); const r = this.mapRef.current.getBoundingClientRect();\n      this.zoomAt((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height, e.deltaY > 0 ? 1.18 : 1 / 1.18); };\n    this.attach();\n  }\n  componentWillUnmount() { clearTimeout(this.waitURG); document.removeEventListener('mousemove', this.onTT); this.ttEl && this.ttEl.remove(); clearInterval(this.timer); this.ro && this.ro.disconnect(); this.mapRef.current && this.mapRef.current.removeEventListener('wheel', this.onWheel); }\n  curVB() { return this.state.vbC || (this.state.zoom === 'area' ? this.vbArea : this.vbReg); }\n  zoomAt(px, py, f) {\n    const vb = this.curVB(), nw = Math.max(30, Math.min(1400, vb[2] * f)), g = nw / vb[2], nh = vb[3] * g;\n    this.setState({ vbC: [vb[0] + px * vb[2] - px * nw, vb[1] + py * vb[3] - py * nh, nw, nh], hover: null });\n  }\n  onDown = e => {\n    if (e.button !== 0) return;\n    const r = this.mapRef.current.getBoundingClientRect(), vb0 = this.curVB(), x0 = e.clientX, y0 = e.clientY;\n    this.dragged = false; let raf = 0, last = null;\n    const move = ev => { const dx = ev.clientX - x0, dy = ev.clientY - y0;\n      if (!this.dragged && Math.hypot(dx, dy) < 4) return; this.dragged = true; last = [dx, dy];\n      if (!raf) raf = requestAnimationFrame(() => { raf = 0; const [ddx, ddy] = last;\n        this.setState({ hover: null, vbC: [vb0[0
